<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<meta name="description" content="تسكاتي — نظّم مهامك، تابع إنجازك، وخلّص اللي عليك واحدة واحدة.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<title>تسكاتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --bg:#0F172A; --card:rgba(255,255,255,.07); --ink:#F8FAFC; --muted:#b7c8d6; --line:rgba(226,232,240,.14);
  --accent:#22C55E; --accent-ink:#052e16; --done:#22C55E; --danger:#fb7185;
  --display:"Baloo Bhaijaan 2","Tajawal",Tahoma,sans-serif;
  --body:"Tajawal",Tahoma,"Segoe UI",sans-serif;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 12% 10%,color-mix(in srgb,var(--done) 17%,transparent),transparent 38%),radial-gradient(ellipse at 88% 35%,rgba(59,130,246,.16),transparent 36%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:32px 18px calc(120px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(52px,14vw,78px);line-height:1;margin:0;letter-spacing:-1px}
h1 span{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:2px 16px 8px;border-radius:20px;transform:rotate(-1.5deg);box-shadow:0 8px 30px color-mix(in srgb,var(--done) 16%,transparent)}
.sub{margin:13px 0 0;color:var(--muted);font-size:16px}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--done);outline-offset:3px}
.gear{flex:none;width:46px;height:46px;border-radius:16px;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 9%,transparent);backdrop-filter:blur(16px);display:grid;place-items:center;transition:background .2s,transform .2s}
.gear:hover{background:color-mix(in srgb,var(--done) 15%,transparent);transform:translateY(-1px)}
.gear svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.gear[aria-expanded="true"]{background:color-mix(in srgb,var(--done) 20%,transparent);border-color:var(--done)}
.panel,.progress{background:var(--card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;padding:16px 18px;margin-bottom:16px;box-shadow:0 14px 38px rgba(0,0,0,.12)}
.panel{display:grid;gap:15px}
.panel[hidden]{display:none}
.grp b{display:block;margin-bottom:7px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:color-mix(in srgb,var(--ink) 5%,transparent);border:1px solid var(--line);border-radius:99px;padding:5px 14px;font-size:15px;color:var(--muted);transition:all .2s}
.chip:hover{border-color:color-mix(in srgb,var(--done) 60%,transparent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #172033;box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.progress{padding:16px 18px}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:10px}
.bar{height:10px;background:color-mix(in srgb,var(--ink) 14%,transparent);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--done),var(--accent));border-radius:99px;transition:width .4s ease;box-shadow:0 0 16px color-mix(in srgb,var(--done) 30%,transparent)}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:1px solid color-mix(in srgb,var(--accent) 50%,transparent);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;box-shadow:0 8px 26px color-mix(in srgb,var(--done) 25%,transparent);z-index:20;transition:transform .2s,box-shadow .2s}
.fab:hover{transform:translateY(-3px);box-shadow:0 12px 32px color-mix(in srgb,var(--done) 32%,transparent)}
.fab svg{width:28px;height:28px;stroke:currentColor;stroke-width:3;fill:none;stroke-linecap:round;transition:transform .2s}
.fab[aria-expanded="true"] svg{transform:rotate(45deg)}
.fab:active{transform:scale(.97)}
.add{position:fixed;left:92px;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));height:60px;z-index:20;display:flex}
.add[hidden]{display:none}
.add input{flex:1;min-width:0;height:100%;font:inherit;padding:0 18px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:20px;background:var(--bg);color:var(--ink);backdrop-filter:blur(18px);box-shadow:0 8px 26px rgba(0,0,0,.22)}
.add input::placeholder{color:var(--muted)}
.filters{display:flex;gap:7px;margin-bottom:13px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:18px;padding:13px 14px;transition:background-color .3s,border-color .3s,transform .2s;box-shadow:0 8px 22px rgba(0,0,0,.08)}
li:hover{border-color:color-mix(in srgb,var(--done) 30%,transparent)}
li.empty{display:block;text-align:center;color:var(--muted);padding:34px 10px;border-style:dashed;background:color-mix(in srgb,var(--ink) 5%,transparent)}
li .chk{flex:none;width:28px;height:28px;border-radius:9px;border:1.5px solid rgba(226,232,240,.45);background:color-mix(in srgb,var(--ink) 5%,transparent);display:grid;place-items:center;padding:0;transition:background-color .3s,border-color .3s}
li .chk svg{width:16px;height:16px;stroke:var(--bg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s ease}
li.done .chk{background:var(--done);border-color:var(--done)}
li.done .chk svg{stroke-dashoffset:0}
li .txt{flex:1;min-width:0;overflow-wrap:anywhere;background:none;border:0;text-align:start;padding:0;color:var(--ink)}
li .txt span{background:linear-gradient(currentColor,currentColor) no-repeat right center/0 2px;transition:background-size .35s ease,color .3s}
html[dir="ltr"] li .txt span{background-position:left center}
li.done .txt span{background-size:100% 2px;color:var(--done)}
li.done{background:color-mix(in srgb,var(--done) 9%,transparent);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
li.cancelling,li.cx{background:rgba(251,113,133,.09);border-color:rgba(251,113,133,.45)}
li.cancelling .txt span,li.cx .txt span{background-size:100% 2px;color:var(--danger)}
li.cancelling .del{color:var(--danger)}
li .edit{flex:1;min-width:0;font:inherit;padding:4px 8px;border:1px solid var(--done);border-radius:10px;background:var(--bg);color:var(--ink)}
li .del{flex:none;background:none;border:0;color:var(--muted);font-size:24px;line-height:1;padding:4px 8px;border-radius:8px;transition:color .3s}
li .del:hover{color:var(--danger)}
.ib{flex:none;background:none;border:0;color:var(--muted);padding:6px;border-radius:8px;display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.back:hover{color:var(--done)}
.ib.trash:hover{color:var(--danger)}
footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;color:var(--muted);font-size:15px}
footer button{background:none;border:0;color:var(--danger);font-weight:700;padding:4px 8px}
footer button:disabled{opacity:.35;cursor:default}
.cxbox{margin-top:26px}
.cxbox[hidden]{display:none}
.cxhead{display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;margin-bottom:8px;font-weight:700;color:var(--danger)}
.cxhead svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.cxhead[aria-expanded="false"] svg{transform:rotate(90deg)}
@media(max-width:420px){
  main{padding:24px 14px calc(110px + env(safe-area-inset-bottom,0px))}
  h1{font-size:clamp(48px,13vw,64px)}
  .sub{font-size:14px}
  .progress,.panel{padding:13px 14px;border-radius:18px}
  li{padding:11px 10px;gap:9px}
  .fab{left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:18px}
  .add{left:80px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));height:54px}
}


.add{gap:7px;align-items:stretch}
.add input{min-width:0}
.add>button{flex:none;width:48px;border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:24px;font-weight:800}
.add #detailsToggle{background:var(--bg);color:var(--ink);font-size:20px}
.task-details{position:absolute;bottom:70px;left:0;right:0;padding:14px;display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.3)}
.task-details[hidden]{display:none}
.task-details label{display:grid;gap:4px;color:var(--muted);font-size:14px}
.task-details input,.task-details select{width:100%;min-width:0;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px;font:inherit}
.task-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;font-size:13px;color:var(--muted)}
.tag{padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--ink) 9%,transparent);border:1px solid var(--line)}
.tag.high{color:var(--danger);border-color:rgba(251,113,133,.45)}
.tag.low{color:#93c5fd;border-color:rgba(96,165,250,.4)}
.tag.overdue{color:var(--danger);border-color:#fb7185}
.tag.due{color:var(--done);border-color:color-mix(in srgb,var(--done) 40%,transparent)}
li .task-main{flex:1;min-width:0}
li .task-main .txt{display:block;width:100%}
.search{width:100%;margin-bottom:10px;font:inherit;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink)}
.filters{flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;box-shadow:0 8px 26px rgba(0,0,0,.3);max-width:92vw}
.toast[hidden]{display:none}
.toast button{background:none;border:0;font-weight:800;color:inherit;text-decoration:underline;padding:0}
#qd{display:flex;gap:6px;flex-wrap:wrap}
.hint{display:block;color:var(--muted);margin-top:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1><span id="brand">تسكاتي</span></h1>
      <p class="sub" id="sub"></p>
    </div>
    <button class="gear" id="gear" type="button" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>
    </button>
  </header>

  <section class="panel" id="panel" hidden></section>

  <section class="progress" aria-live="polite">
    <div class="row"><span id="label"></span><span id="pct">0%</span></div>
    <div class="bar"><i id="fill"></i></div>
  </section>



  <form class="add" id="addBar" hidden>
    <input id="in" type="text" maxlength="200" autocomplete="off" placeholder="اكتب المهمة..." aria-label="اسم المهمة">
    <button type="button" id="detailsToggle" title="تفاصيل المهمة" aria-label="تفاصيل المهمة">📅</button>
    <button type="submit" id="saveTask" title="إضافة المهمة" aria-label="إضافة المهمة">＋</button>
    <div class="task-details" id="taskDetails" hidden>
      <div id="qd"></div>
      <label><span data-t="due"></span><input id="due" type="datetime-local"></label>
      <label><span data-t="prio"></span><select id="priority"><option value="normal" data-t="normal"></option><option value="high" data-t="high"></option><option value="low" data-t="low"></option></select></label>
      <label><span data-t="rep"></span><select id="repeat"><option value="none" data-t="rnone"></option><option value="daily" data-t="daily"></option><option value="weekly" data-t="weekly"></option></select></label>
    </div>
  </form>
  <button class="fab" id="fab" type="button" aria-expanded="false" aria-controls="addBar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

  <input id="q" class="search" type="search" autocomplete="off">
  <div class="filters" id="filters" role="group"></div>
  <ul id="list"></ul>
  <input type="file" id="file" accept="application/json" hidden>
  <div class="toast" id="toast" role="status" hidden></div>
  <footer>
    <span id="left"></span>
    <button id="clear" type="button"></button>
  </footer>

  <section class="cxbox" id="cxbox" hidden>
    <button class="cxhead" id="cxhead" type="button" aria-expanded="true"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg><span id="cxlabel"></span></button>
    <ul id="cxlist"></ul>
  </section>
</main>

<script>
(function(){
  "use strict";
  var TK="taskati:v2", OLD_TK="taskati:v1", SK="taskati:settings:v1";
  var tasks=[], editId=null, filter="all", cxOpen=true, busy={};

    if(r){var p=JSON.parse(r);if(Array.isArray(p))tasks=p;}
    else {var old=JSON.parse(localStorage.getItem(OLD_TK)||"[]");if(Array.isArray(old))tasks=old;}
  }catch(e){}
  tasks=tasks.map(function(t){return Object.assign({priority:"normal",due:"",repeat:"none",created:Date.now()},t);});
  try{var q=localStorage.getItem(SK);if(q){var o=JSON.parse(q);for(var k in o)if(k in S)S[k]=o[k];}}catch(e){}
  function saveT(){try{localStorage.setItem(TK,JSON.stringify(tasks));}catch(e){}}
  function saveS(){try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){}}
  var $=function(id){return document.getElementById(id)};
  var L={
    ar:{brand:"تسكاتي",sub:"اكتب اللي عليك، وخلّصه واحدة واحدة.",ph:"إيه المهمة الجاية؟",all:"الكل",active:"لسه",done:"خلصت",none:"لسه مفيش مهام",fin:"كله خلص. برافو!",e0:"الصفحة فاضية. اكتب أول مهمة بزرار +.",e1:"مفيش مهام هنا.",clear:"امسح اللي خلص",set:"الإعدادات",lang:"اللغة",color:"اللون",mode:"الشكل",sound:"صوت الإنجاز",auto:"تلقائي",light:"فاتح",dark:"داكن",off:"بدون صوت",chime:"رنين",pop:"فقاعة",coin:"عملة",tada:"فرحة",edit:"اضغط لتعديل المهمة",cancel:"ألغِ المهمة",c1:"علّم إنها خلصت",c0:"رجّع المهمة",nw:"مهمة جديدة",ed:"تعديل المهمة",flt:"تصفية المهام",cx:"الملغية",restore:"استرجاع",delf:"احذف نهائيًا",due:"الموعد",prio:"الأولوية",normal:"عادية",high:"عالية",low:"منخفضة",rep:"التكرار",rnone:"بدون تكرار",daily:"يوميًا",weekly:"أسبوعيًا",td:"النهاردة",tm:"بكرة",nw7:"الأسبوع الجاي",today:"مهام اليوم",late:"متأخرة",search:"ابحث في المهام…",hi:"أولوية عالية",lo:"أولوية منخفضة",ovd:"متأخرة: ",dueP:"الموعد: ",repD:"تكرار يومي",repW:"تكرار أسبوعي",undo:"تراجع",cxd:"اتلغت المهمة",cleared:"اتمسحت المهام المنتهية",deld:"اتحذفت المهمة",rem:"التذكيرات والبيانات",remOn:"التذكيرات مفعّلة",remOff:"التذكيرات متوقفة",exp:"تصدير نسخة احتياطية",imp:"استيراد",imported:"تم الاستيراد",badf:"الملف غير صالح",inst:"ثبّت التطبيق",ios:"على iPhone: اضغط مشاركة ثم «إضافة إلى الشاشة الرئيسية».",remNote:"التذكيرات تعمل أثناء فتح الموقع أو التطبيق.",denied:"اسمح بالإشعارات من إعدادات المتصفح.",upd:"فيه نسخة جديدة",updb:"تحديث",soon:"موعد مهمتك قريب: ",rv:"راجع مهامك — عندك N مهام غير مكتملة.",editb:"تعديل التفاصيل"},
    en:{brand:"Taskaty",sub:"Write it down, tick it off, one by one.",ph:"What’s next?",all:"All",active:"To do",done:"Done",none:"No tasks yet",fin:"All done. Nice work!",e0:"Nothing here yet. Add your first task with +.",e1:"No tasks in this view.",clear:"Clear done",set:"Settings",lang:"Language",color:"Color",mode:"Appearance",sound:"Completion sound",auto:"Auto",light:"Light",dark:"Dark",off:"No sound",chime:"Chime",pop:"Pop",coin:"Coin",tada:"Tada",edit:"Click to edit",cancel:"Cancel task",c1:"Mark as done",c0:"Mark as not done",nw:"New task",ed:"Edit task",flt:"Filter tasks",cx:"Cancelled",restore:"Restore",delf:"Delete permanently",due:"Due",prio:"Priority",normal:"Normal",high:"High",low:"Low",rep:"Repeat",rnone:"No repeat",daily:"Daily",weekly:"Weekly",td:"Today",tm:"Tomorrow",nw7:"Next week",today:"Today",late:"Overdue",search:"Search tasks…",hi:"High priority",lo:"Low priority",ovd:"Overdue: ",dueP:"Due: ",repD:"Repeats daily",repW:"Repeats weekly",undo:"Undo",cxd:"Task cancelled",cleared:"Done tasks cleared",deld:"Task deleted",rem:"Reminders & data",remOn:"Reminders on",remOff:"Reminders off",exp:"Export backup",imp:"Import",imported:"Imported",badf:"Invalid file",inst:"Install app",ios:"On iPhone: tap Share, then Add to Home Screen.",remNote:"Reminders work while the app is open.",denied:"Allow notifications in browser settings.",upd:"New version available",updb:"Update",soon:"Task due soon: ",rv:"You have N unfinished tasks.",editb:"Edit details"}
  };
  var PAL=[{id:"green",h:145,ar:"أخضر",en:"Green"},{id:"teal",h:175,ar:"فيروزي",en:"Teal"},{id:"blue",h:215,ar:"أزرق",en:"Blue"},{id:"purple",h:265,ar:"بنفسجي",en:"Purple"},{id:"pink",h:330,ar:"وردي",en:"Pink"},{id:"orange",h:25,ar:"برتقالي",en:"Orange"}];
  var t=function(k){return L[S.lang][k]};
  var mq=window.matchMedia?window.matchMedia("(prefers-color-scheme: dark)"):null;
  function theme(){
    var h=145;PAL.forEach(function(p){if(p.id===S.pal)h=p.h;});
    var dark=S.mode==="dark"||(S.mode==="auto"&&mq&&mq.matches);
    var c=dark?{bg:"hsl("+h+" 45% 12%)",card:"hsl("+h+" 40% 17%)",ink:"hsl("+h+" 60% 92%)",muted:"hsl("+h+" 22% 66%)",line:"hsl("+h+" 35% 28%)",accent:"hsl("+h+" 70% 70%)",ai:"hsl("+h+" 60% 15%)",done:"hsl("+h+" 65% 58%)",danger:"#ff8a8a"}:{bg:"hsl("+h+" 38% 92%)",card:"hsl("+h+" 50% 99%)",ink:"hsl("+h+" 55% 15%)",muted:"hsl("+h+" 22% 40%)",line:"hsl("+h+" 30% 83%)",accent:"hsl("+h+" 70% 72%)",ai:"hsl("+h+" 60% 14%)",done:"hsl("+h+" 75% 30%)",danger:"#c8434f"};
    var s=document.documentElement.style;s.setProperty("--bg",c.bg);s.setProperty("--card",c.card);s.setProperty("--ink",c.ink);s.setProperty("--muted",c.muted);s.setProperty("--line",c.line);s.setProperty("--accent",c.accent);s.setProperty("--accent-ink",c.ai);s.setProperty("--done",c.done);s.setProperty("--danger",c.danger);s.colorScheme=dark?"dark":"light";
  }
  if(mq){var mf=function(){if(S.mode==="auto")theme();};if(mq.addEventListener)mq.addEventListener("change",mf);else if(mq.addListener)mq.addListener(mf);}
